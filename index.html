<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Name Gen</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --accent: #6366f1;
            --glass: rgba(255, 255, 255, 0.7);
            --shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-gradient);
            overflow: hidden;
        }

        .container {
            background: var(--glass);
            backdrop-filter: blur(20px);
            padding: 3rem;
            border-radius: 32px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.4);
            width: 90%;
            max-width: 500px;
            text-align: center;
            transform: translateY(0);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .container:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.12);
        }

        h1 {
            font-weight: 800;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #475569;
            margin-bottom: 2rem;
        }

        .display-area {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
            position: relative;
        }

        #name-output {
            font-size: 2.5rem;
            font-weight: 700;
            color: #1e293b;
            display: flex;
            gap: 12px;
        }

        .word-span {
            display: inline-block;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* The "Pop" Animation */
        .pop {
            animation: springPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes springPop {
            0% { transform: scale(0.5) translateY(20px); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        .btn-premium {
            background: #1e293b;
            color: white;
            border: none;
            padding: 1.2rem 2.5rem;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-premium:hover {
            background: var(--accent);
            transform: scale(1.02);
            box-shadow: 0 15px 30px rgba(99, 102, 241, 0.3);
        }

        .btn-premium:active {
            transform: scale(0.98);
        }

        .svg-icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Name Gen</h1>
        
        <div class="display-area">
            <div id="name-output">
                <span class="word-span">Press</span>
                <span class="word-span">Start</span>
            </div>
        </div>

        <button class="btn-premium" onclick="generateName()">
            <svg class="svg-icon" viewBox="0 0 24 24">
                <path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
            </svg>
            Generate
        </button>
    </div>

    <script>
        const data = {
            "firstNames": ["Jayden", "Anson", "Johnny", "Caseoh", "Nigger", "Jeffery", "Chalire", "Hugo", "Max", "Chester"],
            "lastNames": ["Africa", "Bieber", "Cum", "Dick", "Epstein", "Fuck", "Goon", "Huh", "Israel", "Joke", "Krik", "Lil", "Mommy", "Nigger", "OMG", "Porn"]
        };

        function generateName() {
            const output = document.getElementById('name-output');
            
            // Pick randoms
            const first = data.firstNames[Math.floor(Math.random() * data.firstNames.length)];
            const last = data.lastNames[Math.floor(Math.random() * data.lastNames.length)];

            // Clear and animate
            output.innerHTML = '';
            
            const firstSpan = document.createElement('span');
            firstSpan.className = 'word-span pop';
            firstSpan.innerText = first;

            const lastSpan = document.createElement('span');
            lastSpan.className = 'word-span pop';
            lastSpan.style.animationDelay = '0.1s';
            lastSpan.innerText = last;

            output.appendChild(firstSpan);
            output.appendChild(lastSpan);
        }
    </script>
</body>
</html>
